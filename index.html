<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meteor Love Field</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage" aria-label="gesture controlled meteor field">
      <canvas id="scene"></canvas>

      <section class="hud" aria-live="polite">
        <div class="brand">Chen Yun &amp; Song Bingbing</div>
        <div id="status" class="status">正在准备星空...</div>
      </section>

      <video id="camera" class="camera" playsinline muted></video>

      <button id="cameraButton" class="camera-button" type="button">
        开启摄像头
      </button>

      <div id="gestureBadge" class="gesture-badge">等待手势</div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="./app.js"></script>
  </body>
</html>
